<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy · China Travel: Trip Prep</title>
<style>
  :root { --paper:#F8F7F4; --ink:#1C1C1E; --ink2:#55555C; --muted:#8A8A90; --line:#E4E2DC; --accent:#1F7A43; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.65; }
  .wrap { max-width:720px; margin:0 auto; padding:56px 24px 88px; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  h1 { font-size:38px; line-height:1.12; letter-spacing:-.03em; margin:14px 0 8px; font-weight:800; }
  .meta { font-size:13px; color:var(--muted); }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:28px 0 34px; padding-bottom:22px; border-bottom:1px solid var(--line); }
  .tabs button { font:inherit; font-size:13px; font-weight:600; padding:7px 14px; border:1px solid var(--line);
    border-radius:999px; background:#fff; color:var(--ink2); cursor:pointer; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  h2 { font-size:17px; letter-spacing:-.01em; margin:32px 0 10px; font-weight:750; }
  p, li { font-size:15px; color:var(--ink2); }
  ul { margin:0; padding-left:20px; }
  li { margin:5px 0; }
  .note { margin-top:40px; padding:18px 20px; border-left:3px solid var(--accent); background:#fff;
    border-radius:0 12px 12px 0; font-size:14px; color:var(--ink2); }
  footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  a { color:var(--accent); }
  @media (max-width:600px) { .wrap { padding:36px 18px 64px; } h1 { font-size:30px; } }
</style>
</head>
<body>

  <div class="eyebrow" id="eyebrow">Privacy</div>

  <div class="meta" id="meta">Last updated 13 November 2026 · Version 1.2.0</div>
  <div class="tabs" id="tabs"></div>
  <div id="body"></div>
  <div class="note" id="note"></div>
  <footer>China Travel: Trip Prep · Not a ticketing platform. Contact: <a href="mailto:41867673@qq.com">41867673@qq.com</a></footer>
</div>
<script>

    blocks:[
      ['Обзор','Мы серьёзно относимся к приватности. Здесь описано, как приложение работает с вашими данными. Аккаунт и вход не требуются.'],

      ['콘텐츠 업데이트 (1.2.0 신규)',['앱은 명소 정보·발매 규칙·번역문이 담긴 공개 정적 데이터 파일을 익명으로 다운로드합니다. 요청에는 이름·기기 식별자·여행 정보가 없습니다.','업데이트에는 데이터와 문구만 포함되며 실행 코드가 없고 기능이나 구매 내용도 바뀌지 않습니다.','전체 명소 데이터가 앱에 내장되어 오프라인에서도 정상 사용 가능하며, 업데이트 실패가 이용을 막지 않습니다.','«마이»에서 콘텐츠 버전 확인, 수동 업데이트, 내장 데이터 초기화가 가능합니다.']],
      ['번역 및 음성',['번역·음성 인식·읽기는 Apple 시스템 프레임워크로 기기 내 처리되며 원문·번역·음성은 어떤 서버로도 전송되지 않습니다.','음성 대화에는 마이크·음성 인식 권한이 필요하며 시스템 설정에서 언제든 해제할 수 있습니다.','Apple은 원문·번역을 제외한 언어 쌍 및 성능 통계를 수집할 수 있습니다.']],

      ['사용자 권한','언제든지 명소 삭제, 알림 끄기, 번역 기록 정리, 다운로드 데이터 초기화를 할 수 있습니다.'],

  ja: {
    label:'日本語', eyebrow:'プライバシー', title:'プライバシーポリシー',
    meta:'最終更新 2026年11月13日 · バージョン 1.2.0',
    blocks:[
      ['概要','当アプリはプライバシーを重視しています。本方針は情報の取り扱いを説明します。アカウントやログインは不要です。'],
      ['端末に保存されるもの',['リストに追加した名所、設定した予約リマインダー、旅行日程','言語と画面テーマの設定','翻訳の会話履歴']],
      ['データの保存先',['上記はすべて端末内にのみ保存され、アップロード・同期・共有は行いません。','氏名、証明書番号、電話番号、メール、位置情報、連絡先、広告識別子は収集しません。','第三者へデータを共有・販売することはありません。','アプリを削除するとローカルデータはすべて消去されます。']],
      ['コンテンツ更新（1.2.0 で追加）',['アプリは名所情報・発売ルール・翻訳文を含む公開の静的データファイルを匿名で取得します。リクエストに氏名・端末識別子・旅行情報は含まれません。','更新にはデータと文のみが含まれ、実行コードはなく、機能や購入内容も変わりません。','全名所データはアプリに内蔵されオフラインでも利用可能です。更新失敗が利用を妨げることはありません。','「マイ」でコンテンツのバージョン確認、手動更新、内蔵データへのリセットができます。']],

      ['購入とお支払い',['完全ガイドは 7日間の無料試用付きの買い切りです。','お支払いは Apple App Store (StoreKit) が処理し、カード・決済情報は確認・保存しません。','購入・復元・返金は Apple を通じて行われます。']],

    note:'本アプリは発券プラットフォームではありません。チケットの予約・販売は行わず、公式チャネルでご自身でご購入ください。'
  }
};
const order = ['en','zh','ru','ko','ja'];
let cur = 'en';
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render(){
  const d = L[cur];
  document.documentElement.lang = cur === 'zh' ? 'zh-CN' : cur;
  document.getElementById('eyebrow').textContent = d.eyebrow;
  document.getElementById('title').textContent = d.title;
  document.getElementById('meta').textContent = d.meta;
  document.getElementById('note').textContent = d.note;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.l === cur));
  document.getElementById('body').innerHTML = d.blocks.map(([h, v]) =>
    '<h2>' + esc(h) + '</h2>' + (Array.isArray(v)
      ? '<ul>' + v.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'
      : '<p>' + esc(v) + '</p>')).join('');
}
const tabs = document.getElementById('tabs');
tabs.innerHTML = order.map(k => '<button type="button" data-l="' + k + '">' + esc(L[k].label) + '</button>').join('');
tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { cur = b.dataset.l; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } });
render();
</script>
</body>
</html>
